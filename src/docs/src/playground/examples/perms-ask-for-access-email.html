<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <h3>Email me my receipt</h3>
    <button id="go">Send receipt</button>
    <script>
        // A checkout flow that needs somewhere to send the receipt, and would
        // rather not ask the user to retype an address Puter already has.
        document.getElementById('go').addEventListener('click', async () => {
            // Resolves to the address itself, not a boolean.
            const email = await puter.perms.request('email');

            if (!email) {
                puter.print('No address — showing the manual entry form instead');
                return;
            }
            puter.print(`Receipt will go to ${email}`);
        });
    </script>
</body>
</html>
