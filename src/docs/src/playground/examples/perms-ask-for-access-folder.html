<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <h3>Photo editor</h3>
    <button id="go">Export to Pictures</button>
    <script>
        // An editor saving its result back where the user keeps photos, rather
        // than making them download it and put it there by hand.
        document.getElementById('go').addEventListener('click', async () => {
            // Resolves to the folder's path, or undefined when declined.
            const path = await puter.perms.request('folder', {
                name: 'Pictures',
                access: 'write',
            });

            if (!path) {
                puter.print('Export cancelled — no access to Pictures');
                return;
            }

            await puter.fs.write(`${path}/edited.txt`, 'pretend this is a PNG');
            puter.print(`Exported to ${path}/edited.txt`);
        });
    </script>
</body>
</html>
