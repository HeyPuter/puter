<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
    (async () => {
        // DeepSeek V4.1 Flash
        const chat_resp = await puter.ai.chat('Tell me something I  might not know about chemistry.', {model: 'deepseek-flash', stream: true });
        puter.print('<h1>DeepSeek V4.1 Flash:</h1>');
        for await ( const part of chat_resp )
            if (part?.reasoning) puter.print(part?.reasoning);
            else puter.print(part?.text);

        // DeepSeek V4 Pro
        const reasoner_resp = await puter.ai.chat('Tell me something I  might not know about chemistry.', {model: 'deepseek-v4-pro', stream: true });
        puter.print('<h1>DeepSeek V4 Pro:</h1>');
        for await ( const part of reasoner_resp )
            if (part?.reasoning) puter.print(part?.reasoning);
            else puter.print(part?.text);
    })();
    </script>
</body>
</html>
