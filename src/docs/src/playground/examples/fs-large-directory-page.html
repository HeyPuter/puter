<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <h3>File browser</h3>
    <button id="more">Load more</button>
    <script>
        // An infinite-scrolling list: one page per scroll to the bottom,
        // standing in here for a button.
        let cursor = null, done = false, seeded = false;

        document.getElementById('more').addEventListener('click', async () => {
            if (done) return;

            if (!seeded) {
                for (let i = 0; i < 7; i++) {
                    await puter.fs.write(`uploads/file-${i}.txt`, `n=${i}`, {
                        createMissingParents: true,
                    });
                }
                seeded = true;
            }

            const page = await puter.fs.readdir({ path: 'uploads', cursor, limit: 3 });
            for (const item of page.items) puter.print(`${item.name}<br>`);

            // Absent cursor is the end — not a short page.
            cursor = page.cursor ?? null;
            if (!page.cursor) {
                done = true;
                puter.print('<b>— end of directory —</b>');
            }
        });
    </script>
</body>
</html>
