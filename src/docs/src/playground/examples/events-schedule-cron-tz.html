<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        (async () => {
            if (!await puter.perms.request('backgroundEvents')) {
                puter.print('background events were not allowed<br>');
                return;
            }

            // (1) Weekdays at 08:00 in this browser's time zone
            const schedule = await puter.events.onSchedule({
                cron: '0 8 * * 1-5',
                tz: Intl.DateTimeFormat().resolvedOptions().timeZone,
                handler: async ({ ctx, user, fetch }) => {
                    const response = await fetch(ctx.url);
                    await user.notifications.notify({
                        title: ctx.title,
                        text: await response.text(),
                    });
                },
                context: { url: 'https://api.github.com/zen', title: 'Good morning' },
            });
            puter.print(`${schedule.cron} in ${schedule.tz}<br>`);
            puter.print(`next run: ${new Date(schedule.nextRunAt).toLocaleString()}<br>`);

            // (2) Cleanup: end the schedule, then remove the handler it created
            await schedule.off();
            await puter.events.handlers.remove(schedule.handlerName, { scope: 'user' });
            puter.print('removed<br>');
        })();
    </script>
</body>
</html>
