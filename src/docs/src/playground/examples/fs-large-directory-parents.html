<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        (async () => {
            // Without createMissingParents this fails: reports/2026/q3 is absent.
            try {
                await puter.fs.write('reports/2026/q3/summary.txt', 'no parents');
                puter.print('wrote it (the folders already existed)<br>');
            } catch (e) {
                puter.print(`without the option: ${e.code ?? e.message}<br>`);
            }

            await puter.fs.write('reports/2026/q3/summary.txt', 'with parents', {
                createMissingParents: true,
            });
            puter.print('with createMissingParents: written<br><br>');

            // mkdir takes the same three options.
            await puter.fs.mkdir('reports/2027/q1', { createMissingParents: true });
            puter.print('and the same for mkdir');
        })();
    </script>
</body>
</html>
