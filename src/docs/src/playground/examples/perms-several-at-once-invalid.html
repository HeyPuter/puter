<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        // Every entry is validated before anything is asked, so none of these
        // put up a dialog first.
        const bad = [
            ['both forms at once', () =>
                puter.perms.request('permission', {
                    permission: 'a:b', permissions: ['c:d'],
                })],
            ['a batch with a second argument', () =>
                puter.perms.request([{ resource: 'email' }], { access: 'write' })],
            ['conflicting create values', () =>
                puter.perms.request([
                    { resource: 'permission', permission: 'fs:/a/x:read', create: 'dir' },
                    { resource: 'permission', permission: 'fs:/a/y:read', create: 'file' },
                ])],
            ['a misspelled resource', () =>
                puter.perms.request('folders', { name: 'Documents' })],
        ];

        (async () => {
            for (const [label, run] of bad) {
                try {
                    await run();
                    puter.print(`${label}: no error<br>`);
                } catch (e) {
                    puter.print(`<b>${label}</b> → ${e.code}: ${e.message}<br>`);
                }
            }
        })();
    </script>
</body>
</html>
