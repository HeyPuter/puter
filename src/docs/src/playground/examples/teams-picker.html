<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <label>Assign to: <select id="assignee"><option>Loading…</option></select></label>
    <button id="save">Save card</button>
    <script>
        const select = document.getElementById('assignee');

        (async () => {
            const [team] = await puter.teams.list().catch(() => []);
            if (!team) {
                select.innerHTML = '<option>No team</option>';
                return;
            }

            const colleagues = await puter.teams.listDirectory(team.uid);
            select.innerHTML = '';
            for (const { username, uuid } of colleagues) {
                const option = document.createElement('option');
                // Show the username, store the uuid — it survives a rename.
                option.textContent = username;
                option.value = uuid;
                select.append(option);
            }
        })();

        document.getElementById('save').addEventListener('click', async () => {
            const option = select.selectedOptions[0];
            if (!option || !option.value) return;
            await puter.kv.set('card:1:assignee', option.value);
            puter.print(`Assigned to ${option.textContent} (${option.value})`);
        });
    </script>
</body>
</html>
