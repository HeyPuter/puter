<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <h3>End a review</h3>
    <input id="path" value="drafts/proposal.md">
    <input id="who" placeholder="reviewer's username">
    <button id="go">Revoke access</button>
    <script>
        // Closing out a review: the reviewer signed off, so the draft goes back
        // to being private.
        document.getElementById('go').addEventListener('click', async () => {
            const path = document.getElementById('path').value.trim();
            const recipient = document.getElementById('who').value.trim();
            if (!recipient) return;

            try {
                const { revoked } = await puter.fs.unshare(path, recipient);
                // 0 is not an error, so a double-click is harmless.
                puter.print(revoked > 0
                    ? `Access ended (${revoked} grant)`
                    : 'They did not have access');
            } catch (e) {
                puter.print(`Could not unshare: ${e.code ?? e.message}`);
            }
        });
    </script>
</body>
</html>
