<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        (async () => {
            let teams;
            try {
                teams = await puter.teams.list();
            } catch (e) {
                if (e.code !== 'not_found') throw e;
                puter.print('Teams are not available on this Puter.');
                return;
            }

            const team = teams[0];
            if (!team) {
                puter.print('You are not on a team.');
                return;
            }

            try {
                const members = await puter.teams.listMembers(team.uid);
                puter.print(`${members.length} member(s) of ${team.name}:<br>`);
                // An app gets `username` only — no email or activation state.
                for (const member of members) puter.print(`${member.username}<br>`);
            } catch (e) {
                if (e.code !== 'team_not_found') throw e;
                puter.print('This team has not opened its directory to apps.');
            }
        })();
    </script>
</body>
</html>
