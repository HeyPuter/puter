<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        (async () => {
            await puter.fs.write('uploads/a.txt', 'a', { createMissingParents: true });
            await puter.fs.write('uploads/b.txt', 'b');

            // includeTotal also switches the result to a page object.
            const { items, total } = await puter.fs.readdir({
                path: 'uploads',
                cursor: null,
                limit: 1,
                includeTotal: true,
            });

            puter.print(`this page: ${items.length}<br>`);
            puter.print(`total in the directory: ${total}`);
        })();
    </script>
</body>
</html>
