<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <h3>Welcome — let's get set up</h3>
    <button id="go">Continue</button>
    <script>
        // A first-run screen: everything the app needs, decided once.
        document.getElementById('go').addEventListener('click', async () => {
            const [documents, email, canReadApps] = await puter.perms.request([
                { resource: 'folder', name: 'Documents', access: 'write' },
                { resource: 'email' },
                { resource: 'apps' },
            ]);

            // Results are positional: the path, the address, a boolean.
            puter.print(documents ? `Saving work to ${documents}<br>` : 'Saving locally only<br>');
            puter.print(email ? `Notifications to ${email}<br>` : 'Notifications off<br>');
            puter.print(canReadApps ? 'Launcher enabled' : 'Launcher hidden');
        });
    </script>
</body>
</html>
