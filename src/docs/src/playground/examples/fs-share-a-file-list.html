<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        (async () => {
            // Resolves to { items, cursor? } — not to an array.
            const { items } = await puter.fs.listShared();

            if (items.length === 0) {
                puter.print('Nothing has been shared with you yet.');
                return;
            }

            for (const item of items) {
                puter.print(`<b>${item.name}</b> — ${item.mode}, from ${item.owner}<br>`);
                // Masked path: /<owner>/<uid>/<name>, usable with any puter.fs method.
                puter.print(`${item.path}<br><br>`);
            }
        })();
    </script>
</body>
</html>
