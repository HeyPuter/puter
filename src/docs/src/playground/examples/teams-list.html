<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <script>
        (async () => {
            let teams;
            try {
                teams = await puter.teams.list();
            } catch (e) {
                // No /teams route at all when the feature is off, so this
                // rejects rather than returning an empty list.
                if (e.code !== 'not_found') throw e;
                puter.print('Teams are not available on this Puter.');
                return;
            }

            if (teams.length === 0) {
                puter.print('You are not on a team.');
                return;
            }

            for (const team of teams) {
                puter.print(`${team.name ?? team.handle ?? 'Unnamed team'}<br>`);
                puter.print(`uid: ${team.uid}<br>`);
                puter.print(`owner: ${team.isOwner}<br>`);
                puter.print(`directory open to apps: ${team.directoryEnabled}<br><br>`);
            }
        })();
    </script>
</body>
</html>
