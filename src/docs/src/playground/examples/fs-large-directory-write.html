<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <button id="dedupe">Write with dedupeName</button>
    <button id="refuse">Write with overwrite: false</button>
    <script>
        document.getElementById('dedupe').addEventListener('click', async () => {
            // Keeps both rather than replacing: report-1.txt, report-2.txt, …
            const file = await puter.fs.write('uploads/report.txt', 'data', {
                dedupeName: true,
                createMissingParents: true,
            });
            puter.print(`wrote ${file.name}<br>`);
        });

        document.getElementById('refuse').addEventListener('click', async () => {
            try {
                await puter.fs.write('uploads/report.txt', 'data', {
                    overwrite: false,
                    createMissingParents: true,
                });
                puter.print('wrote it — the name was free<br>');
            } catch (e) {
                puter.print(`refused: ${e.code ?? e.message}<br>`);
            }
        });
    </script>
</body>
</html>
