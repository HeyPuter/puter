<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <h3>Upload endpoint</h3>
    <button id="dedupe">Upload invoice.pdf (keep both)</button>
    <button id="refuse">Upload invoice.pdf (refuse duplicates)</button>
    <script>
        // Two people send the same filename seconds apart. One policy keeps
        // both; the other refuses the second and lets the caller rename it.
        document.getElementById('dedupe').addEventListener('click', async () => {
            const file = await puter.fs.write('uploads/invoice.pdf', 'data', {
                dedupeName: true,
                createMissingParents: true,
            });
            puter.print(`stored as ${file.name}<br>`);
        });

        document.getElementById('refuse').addEventListener('click', async () => {
            try {
                await puter.fs.write('uploads/invoice.pdf', 'data', {
                    overwrite: false,
                    createMissingParents: true,
                });
                puter.print('stored — the name was free<br>');
            } catch (e) {
                puter.print(`rejected, ask for a new name: ${e.code ?? e.message}<br>`);
            }
        });
    </script>
</body>
</html>
