<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <button id="go">Share a draft with my team</button>
    <script>
        document.getElementById('go').addEventListener('click', async () => {
            const [team] = await puter.teams.list().catch(() => []);
            if (!team) { puter.print('No team'); return; }

            await puter.fs.write('drafts/proposal.md', '# Proposal', {
                createMissingParents: true,
            });

            try {
                // Reaches anyone added to the team later, unlike a per-person loop.
                const [share] = await puter.fs.share(
                    'drafts/proposal.md', { team: team.uid }, 'write',
                );
                puter.print(`Shared with ${team.name} — one grant, not one per member<br>`);
                // `holder_team` is what names a team share; `holder` is a username.
                puter.print(`holder_team: ${share.holder_team?.name ?? team.name}`);
            } catch (e) {
                puter.print(`Could not share: ${e.code ?? e.message}`);
            }
        });
    </script>
</body>
</html>
