<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <h3>App launcher</h3>
    <button id="apps">Show my apps</button>
    <button id="subdomains">Publish this site</button>
    <script>
        // A launcher lists what the user has installed; a deploy button needs
        // one of their own subdomains to publish to.
        document.getElementById('apps').addEventListener('click', async () => {
            // These resolve to a plain boolean, unlike 'folder' and 'email'.
            const granted = await puter.perms.request('apps');
            if (!granted) return puter.print('Cannot list apps without access');

            const apps = await puter.apps.list();
            puter.print(apps.map(a => a.title ?? a.name).join(', ') || 'No apps yet');
        });

        document.getElementById('subdomains').addEventListener('click', async () => {
            // access defaults to 'read'; 'write' covers reading too.
            const granted = await puter.perms.request('subdomains', { access: 'write' });
            puter.print(granted ? 'Ready to publish' : 'Publishing needs subdomain access');
        });
    </script>
</body>
</html>
