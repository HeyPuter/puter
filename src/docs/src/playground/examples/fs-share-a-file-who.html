<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <input id="path" value="report.txt">
    <button id="go">Who can see it?</button>
    <script>
        document.getElementById('go').addEventListener('click', async () => {
            const path = document.getElementById('path').value.trim();

            try {
                const shares = await puter.fs.getShares(path);
                if (shares.length === 0) {
                    puter.print('Not shared with anyone.');
                    return;
                }
                for (const share of shares) {
                    // holder is null for a team share, a link share, or a pending invite.
                    const who = share.holder ?? (share.pending ? share.recipientEmail : 'anyone with the link');
                    puter.print(`${who} — ${share.mode}`);
                    puter.print(share.inheritedFrom ? ` (from ${share.inheritedFrom})<br>` : '<br>');
                }
            } catch (e) {
                puter.print(`Could not read shares: ${e.code ?? e.message}`);
            }
        });
    </script>
</body>
</html>
