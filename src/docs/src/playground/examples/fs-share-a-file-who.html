<html>
<body>
    <script src="https://js.puter.com/v2/"></script>
    <h3>Who has access</h3>
    <input id="path" value="drafts/proposal.md">
    <button id="go">Refresh</button>
    <script>
        // The access list a Share dialog shows underneath the invite box.
        document.getElementById('go').addEventListener('click', async () => {
            const path = document.getElementById('path').value.trim();

            try {
                const shares = await puter.fs.getShares(path);
                if (shares.length === 0) {
                    puter.print('Only you.');
                    return;
                }
                for (const share of shares) {
                    // holder is null for a team share, a link share, or a pending invite.
                    const who = share.holder
                        ?? (share.pending ? `${share.recipientEmail} (invited)` : 'anyone with the link');
                    puter.print(`${who} — ${share.mode}`);
                    // Inherited access is managed on the folder, not here.
                    puter.print(share.inheritedFrom ? ` via ${share.inheritedFrom}<br>` : '<br>');
                }
            } catch (e) {
                puter.print(`Could not read shares: ${e.code ?? e.message}`);
            }
        });
    </script>
</body>
</html>
