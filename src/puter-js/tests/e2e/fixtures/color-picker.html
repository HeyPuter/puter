<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>puter-js test fixture: showColorPicker</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; }
        button { padding: 8px 12px; margin-right: 8px; font-size: 14px; }
        #log { margin-top: 16px; padding: 8px; background: #f5f5f5; border: 1px solid #ddd; min-height: 60px; font-family: monospace; white-space: pre-wrap; }
        .ready #status { color: green; }
    </style>
</head>
<body>
    <h1>puter-js showColorPicker fixture</h1>
    <p id="status">Loading puter.js…</p>

    <button id="color-string" disabled>Color Picker (string)</button>
    <button id="color-default-color" disabled>Color Picker (defaultColor)</button>
    <button id="color-default-value" disabled>Color Picker (defaultValue)</button>
    <button id="color-hex8" disabled>Color Picker (8-digit hex)</button>

    <div id="log" data-testid="log"></div>

    <script>
        window.PUTER_ORIGIN = 'http://puter.localhost:4100';
        // Must be the real api subdomain: the SDK sends credentialed CORS
        // requests, and only the api host answers with
        // Access-Control-Allow-Credentials — on the GUI host they all fail.
        window.PUTER_API_ORIGIN = 'http://api.puter.localhost:4100';
    </script>
    <script src="/dist/puter.dev.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');

        function log(entry) {
            const line = document.createElement('div');
            line.textContent = entry;
            line.dataset.entry = entry;
            logEl.appendChild(line);
        }

        function ready() {
            document.body.classList.add('ready');
            statusEl.textContent = `Ready (env=${puter.env})`;
            document.querySelectorAll('button').forEach((btn) => { btn.disabled = false; });
        }

        function waitForPuter() {
            if (window.puter && puter.ui) ready();
            else setTimeout(waitForPuter, 50);
        }
        waitForPuter();

        async function pickColor(options) {
            try {
                const color = await puter.ui.showColorPicker(options);
                log(`color:${color}`);
            } catch (e) {
                log(`color:error:${e?.message ?? e}`);
            }
        }

        document.getElementById('color-string').addEventListener('click', () => pickColor('#abc'));
        document.getElementById('color-default-color').addEventListener('click', () => pickColor({ defaultColor: '#aabbcc' }));
        document.getElementById('color-default-value').addEventListener('click', () => pickColor({ defaultValue: '#AABBCC' }));
        document.getElementById('color-hex8').addEventListener('click', () => pickColor('#aabbcc80'));
    </script>
</body>
</html>
