<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>puter-js test fixture: file pickers</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; }
        button { padding: 8px 12px; margin-right: 8px; font-size: 14px; }
        #log { margin-top: 16px; padding: 8px; background: #f5f5f5; border: 1px solid #ddd; min-height: 60px; font-family: monospace; white-space: pre-wrap; }
        .ready #status { color: green; }
    </style>
</head>
<body>
    <h1>puter-js file pickers fixture</h1>
    <p id="status">Loading puter.js…</p>

    <button id="open-file" disabled>Open File Picker</button>
    <button id="open-files" disabled>Open Several Files</button>
    <button id="open-images" disabled>Open an Image</button>
    <button id="save-file" disabled>Save File Picker</button>
    <button id="pick-directory" disabled>Directory Picker</button>

    <div id="log" data-testid="log"></div>

    <script>
        window.PUTER_ORIGIN = 'http://puter.localhost:4100';
        // Must be the real api subdomain: the SDK sends credentialed CORS
        // requests, and only the api host answers with
        // Access-Control-Allow-Credentials — on the GUI host they all fail.
        window.PUTER_API_ORIGIN = 'http://api.puter.localhost:4100';
    </script>
    <script src="/dist/puter.dev.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');

        function log(entry) {
            const line = document.createElement('div');
            line.textContent = entry;
            line.dataset.entry = entry;
            logEl.appendChild(line);
        }

        function ready() {
            document.body.classList.add('ready');
            statusEl.textContent = `Ready (env=${puter.env})`;
            document.querySelectorAll('button').forEach((btn) => { btn.disabled = false; });
        }

        function waitForPuter() {
            if (window.puter && puter.ui) ready();
            else setTimeout(waitForPuter, 50);
        }
        waitForPuter();

        // Each picked item is logged as `<prefix>:<name>`; a cancel as `<prefix>:cancelled`.
        const logPicked = (prefix, picked) => {
            if ( picked === undefined ) {
                log(`${prefix}:cancelled`);
                return;
            }
            for ( const item of [].concat(picked) ) log(`${prefix}:${item?.name}`);
        };
        const pickerButton = (id, prefix, pick) => {
            document.getElementById(id).addEventListener('click', async () => {
                try {
                    logPicked(prefix, await pick().undefinedOnCancel);
                } catch (e) {
                    log(`${prefix}:error:${e?.message ?? e}`);
                }
            });
        };

        document.getElementById('open-file').addEventListener('click', async () => {
            try {
                const file = await puter.ui.showOpenFilePicker();
                log(`file:${file?.path ?? file}`);
            } catch (e) {
                log(`file:error:${e?.message ?? e}`);
            }
        });
        pickerButton('open-files', 'files', () => puter.ui.showOpenFilePicker({ multiple: true }));
        pickerButton('open-images', 'image', () => puter.ui.showOpenFilePicker({ accept: 'image/*' }));
        pickerButton('save-file', 'saved', () => puter.ui.showSaveFilePicker('saved from the fixture', 'fixture-save.txt'));
        pickerButton('pick-directory', 'dir', () => puter.ui.showDirectoryPicker());
    </script>
</body>
</html>
