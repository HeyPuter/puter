<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>puter-js test fixture: showFontPicker</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; }
        button { padding: 8px 12px; margin-right: 8px; font-size: 14px; }
        #log { margin-top: 16px; padding: 8px; background: #f5f5f5; border: 1px solid #ddd; min-height: 60px; font-family: monospace; white-space: pre-wrap; }
        .ready #status { color: green; }
    </style>
</head>
<body>
    <h1>puter-js showFontPicker fixture</h1>
    <p id="status">Loading puter.js…</p>

    <button id="font-string" disabled>Font Picker (string)</button>
    <button id="font-default-font" disabled>Font Picker (defaultFont)</button>
    <button id="font-default-value" disabled>Font Picker (defaultValue)</button>
    <button id="font-verdana" disabled>Font Picker (Verdana)</button>

    <div id="log" data-testid="log"></div>

    <script>
        window.PUTER_ORIGIN = 'http://puter.localhost:4100';
        // Must be the real api subdomain: the SDK sends credentialed CORS
        // requests, and only the api host answers with
        // Access-Control-Allow-Credentials — on the GUI host they all fail.
        window.PUTER_API_ORIGIN = 'http://api.puter.localhost:4100';
    </script>
    <script src="/dist/puter.dev.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');

        function log(entry) {
            const line = document.createElement('div');
            line.textContent = entry;
            line.dataset.entry = entry;
            logEl.appendChild(line);
        }

        function ready() {
            document.body.classList.add('ready');
            statusEl.textContent = `Ready (env=${puter.env})`;
            document.querySelectorAll('button').forEach((btn) => { btn.disabled = false; });
        }

        function waitForPuter() {
            if (window.puter && puter.ui) ready();
            else setTimeout(waitForPuter, 50);
        }
        waitForPuter();

        async function pickFont(options) {
            try {
                const font = await puter.ui.showFontPicker(options);
                log(font === false ? 'font:cancel' : font ? `font:${font.fontFamily}` : `font:${font}`);
            } catch (e) {
                log(`font:error:${e?.message ?? e}`);
            }
        }

        document.getElementById('font-string').addEventListener('click', () => pickFont('Georgia'));
        document.getElementById('font-default-font').addEventListener('click', () => pickFont({ defaultFont: 'Georgia' }));
        document.getElementById('font-default-value').addEventListener('click', () => pickFont({ defaultValue: 'georgia' }));
        document.getElementById('font-verdana').addEventListener('click', () => pickFont('Verdana'));
    </script>
</body>
</html>
