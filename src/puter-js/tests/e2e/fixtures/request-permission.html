<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>puter-js test fixture: requestPermission</title>
    <style>
        body { font-family: system-ui, sans-serif; padding: 16px; }
        button { padding: 8px 12px; margin-right: 8px; font-size: 14px; }
        #log { margin-top: 16px; padding: 8px; background: #f5f5f5; border: 1px solid #ddd; min-height: 60px; font-family: monospace; white-space: pre-wrap; }
        .ready #status { color: green; }
    </style>
</head>
<body>
    <h1>puter-js requestPermission fixture</h1>
    <p id="status">Loading puter.js…</p>

    <button id="req-email-perm" disabled>Request Email Permission</button>
    <button id="req-driver-perm" disabled>Request Driver Permission</button>

    <div id="log" data-testid="log"></div>

    <script>
        // Point the SDK at the local Puter instance (env=web popup flow).
        window.PUTER_ORIGIN = 'http://puter.localhost:4100';
        // Must be the real api subdomain: the SDK sends credentialed CORS
        // requests, and only the api host answers with
        // Access-Control-Allow-Credentials — on the GUI host they all fail.
        window.PUTER_API_ORIGIN = 'http://api.puter.localhost:4100';
    </script>
    <script src="/dist/puter.dev.js"></script>
    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');

        function log(entry) {
            const line = document.createElement('div');
            line.textContent = entry;
            line.dataset.entry = entry;
            logEl.appendChild(line);
        }

        function ready() {
            document.body.classList.add('ready');
            statusEl.textContent = `Ready (env=${puter.env})`;
            document.getElementById('req-email-perm').disabled = false;
            document.getElementById('req-driver-perm').disabled = false;
        }

        function waitForPuter() {
            if (window.puter && puter.ui) ready();
            else setTimeout(waitForPuter, 50);
        }
        waitForPuter();

        // Requests to see the user's email. Needs whoami, which needs an
        // auth token: in env=app the GUI injects one, but in env=web the
        // site must sign in first (the realistic third-party flow).
        document.getElementById('req-email-perm').addEventListener('click', async () => {
            try {
                if (!puter.authToken) {
                    log('perm:email:signing-in');
                    await puter.auth.signIn();
                }
                const whoami = await puter.auth.whoami();
                const granted = await puter.ui.requestPermission({
                    permission: `user:${whoami.uuid}:email:read`,
                });
                log(`perm:email:${granted}`);
            } catch (e) {
                log(`perm:email:error:${e?.message ?? e}`);
            }
        });

        // Driver permission: describable without whoami, works in env=web too.
        document.getElementById('req-driver-perm').addEventListener('click', async () => {
            try {
                const granted = await puter.ui.requestPermission({
                    permission: 'driver:puter-image-generation:generate',
                });
                log(`perm:driver:${granted}`);
            } catch (e) {
                log(`perm:driver:error:${e?.message ?? e}`);
            }
        });
    </script>
</body>
</html>
